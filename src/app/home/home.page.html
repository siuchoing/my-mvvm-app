<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      主頁
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="button-container">
    <!-- 按鈕 1：跳轉到 個人檔案 (/profile-user) -->
    <ion-button expand="block" routerLink="/user-profile" routerDirection="forward">
      <ion-icon name="person-outline" slot="start"></ion-icon>
      個人檔案
    </ion-button>

    <!-- 按鈕 2：跳轉到 設定 (/setting) -->
    <ion-button expand="block" color="medium" routerLink="/settings" routerDirection="forward">
      <ion-icon name="settings-outline" slot="start"></ion-icon>
      用戶設定
    </ion-button>
  </div>
</ion-content>
